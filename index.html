<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101310">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="晨间清单">
<meta name="application-name" content="晨间清单">
<meta name="description" content="早上想清楚今天要推进什么，一件也算数；18:00 收个尾，没推进的带到明天。跑满一个月解锁睡前的成功日记。">
<title>晨间清单 · Morning Three</title>
<script>
/* 主题在样式前定好，避免先闪一下浅色再跳深色 */
window.applyTheme = function(){
  var h = new Date().getHours();
  var night = (h >= 18 || h < 5);
  document.documentElement.classList.toggle('night', night);
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content', night ? '#101310' : '#F4F5F2');
};
applyTheme();
</script>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23101310'/><path d='M6 21a10 10 0 0 1 20 0z' fill='%233FE081'/><rect x='4' y='21' width='24' height='3' rx='1.5' fill='%233FE081'/></svg>">
<style>
/* ---------- 主题：05:00–18:00 晨光（浅），18:00–05:00 暗夜荧光（深）----------
   同一套荧光绿调性，只是底与字的明暗互换。变量化后切主题只改这里。 */
:root{
  --bg:#F4F5F2;
  --card:#FFFFFF;
  --ink:#151A16;
  --ink2:#5E665F;
  --ink3:#9DA49E;
  --line:#E9ECE8;
  --line2:#DDE0DB;
  --edge:#D5D9D3;
  --edge2:#C3C8C2;
  --fill:#F1F2EF;
  --fill2:#EFF1EE;
  --fill3:#F6F7F4;
  --fill4:#DDE0DB;
  --brand:#3FE081;        /* 填充用的荧光绿：绿底压深字，两个主题都不变 */
  --brand2:#2FBF6C;
  --brand-txt:#0E6B50;    /* 文字/描边用的绿：浅底上必须压深，否则读不出来 */
  --brand-soft:#E8F5EE;
  --brand-edge:#B9D2C7;
  --brand-edge2:#D9E4DE;
  --brand-line:rgba(14,107,80,.35);
  --warn:#C26600;
  --warn-soft:#FBEEE7;
  --gold:#C26600;
  --gold-soft:#FFF0DF;
  --on:#0B120D;           /* 绿底上的字 */
  --on-dim:rgba(11,18,13,.72);
  --pop:#151A16;          /* 浮层/庆祝卡：与页面底色反着来 */
  --ov:rgba(21,26,22,.42);
  --r:20px;
  --sh:0 1px 2px rgba(21,26,22,.04), 0 12px 32px -16px rgba(21,26,22,.14);
}
html.night{
  --bg:#101310;
  --card:#191D19;
  --ink:#F1F4F0;
  --ink2:#A8B0A8;
  --ink3:#6E7670;
  --line:#2A2F2A;
  --line2:#2E332E;
  --edge:#3A413B;
  --edge2:#565E56;
  --fill:#262B26;
  --fill2:#22271F;
  --fill3:#1E231E;
  --fill4:#232823;
  --brand:#3FE081;
  --brand-txt:#3FE081;
  --brand-soft:#1F3327;
  --brand-edge:#2E4A39;
  --brand-edge2:#2E3A31;
  --brand-line:rgba(63,224,129,.4);
  --warn:#E8734A;
  --warn-soft:#3A2822;
  --gold:#FFB84D;
  --gold-soft:#3A2F1D;
  --on:#0B120D;
  --on-dim:rgba(255,255,255,.72);
  --pop:#222922;
  --ov:rgba(3,6,4,.62);
  --sh:0 1px 2px rgba(0,0,0,.4), 0 14px 36px -16px rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;font-size:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,textarea{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;outline:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

.shell{max-width:600px;margin:0 auto;padding:26px 18px 72px}

/* ---------- header ---------- */
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{font-size:21px;font-weight:700;letter-spacing:-.01em}
.brand-sub{font-size:11px;font-weight:600;letter-spacing:.16em;color:var(--ink3);text-transform:uppercase;margin-top:2px}
.hdr-r{display:flex;align-items:center;gap:8px;padding-top:2px}
.lang{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.04em}
.lang.bell{width:30px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.lang:hover{border-color:var(--edge)}

/* ---------- segmented ---------- */
.seg{display:flex;gap:4px;background:var(--brand-soft);border-radius:13px;padding:4px;margin-bottom:18px}
.seg-i{flex:1;height:36px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink2);transition:.18s}
.seg-i.on{background:var(--brand);color:var(--on);box-shadow:0 1px 3px rgba(0,0,0,.15)}

/* ---------- card ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px;margin-bottom:16px}

/* ---------- 成功日记入口 ---------- */
.sdcard{display:flex;align-items:center;gap:14px;cursor:pointer;transition:.18s}
.sdcard:hover{background:var(--fill3)}
.sd-ico{width:40px;height:40px;flex:none;border-radius:11px;background:var(--gold-soft);display:flex;align-items:center;justify-content:center}
.sdcard.locked .sd-ico{background:var(--fill)}
.sd-t{flex:1;min-width:0}
.sd-h{font-size:16px;font-weight:700;letter-spacing:-.01em}
.sd-p{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.45}
.sd-go{flex:none;font-size:12px;font-weight:700;color:var(--brand-txt);white-space:nowrap}
.sd-caret{flex:none;color:var(--edge2);font-size:17px}
/* 满月但未解锁：收成一行安静的页脚，不与今日三件事抢注意力 */
.sd-wrap{padding:14px 18px;opacity:.78}
.sdcard.slim .sd-ico{width:30px;height:30px;border-radius:9px}
.sdcard.slim .sd-h{font-size:13.5px;font-weight:600;color:var(--ink2)}
.sdcard.slim .sd-p{font-size:11.5px;margin-top:2px}

/* ---------- phase row ---------- */
.phase{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--brand);flex:none}
.pdot.w{background:var(--warn)}
.pdot.g{background:var(--edge2)}
.pname{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--brand-txt)}
.pname.w{color:var(--warn)}
.pname.g{color:var(--ink3)}
.phint{font-size:12px;color:var(--ink3);margin-left:auto;text-align:right}

.h1{font-size:25px;font-weight:700;letter-spacing:-.015em;margin:0 0 4px}
.h1-sub{font-size:13px;color:var(--ink2);margin:0 0 18px}

/* ---------- items ---------- */
.items{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:13px;padding:13px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:2px}
.item.ghost{display:none}
.idx{font-size:11px;font-weight:700;color:var(--ink3);width:18px;flex:none;letter-spacing:.06em;padding-top:1px}
.inp{flex:1;min-width:0;font-size:16px;font-weight:500;padding:9px 0;line-height:1.45;border-bottom:1.5px solid transparent;transition:.15s}
.inp::placeholder{color:var(--edge2);font-weight:400}
.inp:focus{border-bottom-color:var(--brand-txt)}
.txt{flex:1;min-width:0;font-size:16px;font-weight:500;line-height:1.45;word-break:break-word}
.txt.filled-muted{color:var(--ink2)}
.state{flex:none;font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:999px;background:var(--fill);color:var(--ink3)}
.state.ok{background:var(--brand-soft);color:var(--brand-txt)}
.state.no{background:var(--warn-soft);color:var(--warn)}

.check{width:22px;height:22px;border-radius:50%;border:1.8px solid var(--edge);flex:none;display:flex;align-items:center;justify-content:center;transition:.15s;cursor:pointer;padding:0}
.check:hover{border-color:var(--edge2)}
.check.dis{opacity:.28;pointer-events:none}
.check.on{background:var(--brand);border-color:var(--brand)}
.check svg{opacity:0;transition:.15s}
.check.on svg{opacity:1}

.tag{font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:6px;background:var(--fill);color:var(--ink3);flex:none}
.tag.ok{background:var(--brand-soft);color:var(--brand-txt)}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;height:52px;border-radius:14px;background:var(--brand);color:var(--on);font-size:16px;font-weight:700;letter-spacing:.01em;transition:.15s}
.btn:hover{background:var(--brand2)}
.btn:disabled{background:var(--fill4);color:var(--ink3);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand-txt);border:1.5px solid var(--brand-edge2)}
.btn.ghost:hover{background:var(--brand-soft)}
.foot{margin-top:18px}
.foot-note{font-size:12px;color:var(--ink3);text-align:center;margin-top:11px;line-height:1.6}
.carry-note{font-size:12px;color:var(--brand-txt);background:var(--brand-soft);border-radius:10px;
  padding:8px 11px;margin:12px 0 2px;line-height:1.55}

.empty-inline{text-align:center;padding:24px 6px 20px}
.empty-inline .ei-t{font-size:15px;font-weight:600;margin-bottom:5px}
.empty-inline .ei-d{font-size:13px;color:var(--ink3);margin-bottom:18px;line-height:1.6}

/* ---------- stat cards ---------- */
.sc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.sc{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:16px 12px;text-align:center}
.sc-v{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.sc-k{font-size:11px;color:var(--ink3);font-weight:600;margin-top:4px;letter-spacing:.04em}
.sc-v.na{color:var(--edge2)}

/* ---------- chart ---------- */
.chart-card{padding:20px 16px 16px}
.seg2{display:flex;gap:2px;margin:0 4px 16px;background:var(--brand-soft);border-radius:11px;padding:3px}
.seg2-i{flex:1;height:32px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink2);transition:.18s}
.seg2-i.on{background:var(--brand);color:var(--on);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.chart-wrap{position:relative}
.chart-svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:18px;justify-content:center;margin-top:12px;font-size:11.5px;color:var(--ink3);font-weight:600}
.lg{display:flex;align-items:center;gap:6px}
.lg-s{width:16px;height:2.5px;border-radius:2px}
.chart-read{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 4px 10px;min-height:18px}

/* ---------- 提醒卡 ---------- */
.rm-h{font-size:15px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
.rm-d{font-size:13px;color:var(--ink2);line-height:1.55;margin-bottom:14px}
.rm-b{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 12px;margin:0 0 8px;
  border:1px solid var(--brand-edge2);border-radius:14px;background:var(--brand-soft);transition:.16s}
.rm-b:hover{background:var(--brand-soft);border-color:var(--brand-edge)}
.rm-b.primary{background:var(--brand);border-color:var(--brand);color:var(--on)}
.rm-b.primary:hover{background:var(--brand2);border-color:var(--brand2)}
.rm-i{flex:none;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.rm-i svg{width:20px;height:20px}
.rm-t{flex:1;display:block;min-width:0}
.rm-t b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.rm-t i{display:block;font-style:normal;font-size:12px;color:var(--ink3);margin-top:3px;line-height:1.45}
.rm-b.primary .rm-t i{color:var(--on-dim)}
.rm-go{flex:none;font-size:20px;color:var(--ink3);line-height:1}
.rm-b.primary .rm-go{color:var(--on-dim)}
.rm-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;
  border:1px dashed var(--line);border-radius:12px;font-size:13.5px;color:var(--ink2);margin-bottom:8px}
.rm-ok{color:var(--brand-txt);font-weight:700;font-size:13px}
.rm-dim{color:var(--ink3);font-weight:700;font-size:13px}
.rm-note{font-size:12px;color:var(--ink3);line-height:1.6;margin-top:10px}
.rm-note.dim{color:var(--ink3);margin-top:6px}

/* ---------- 安装引导 sheet ---------- */
/* ---------- 提醒 sheet（与安装 sheet 同款，独立 root 互不干扰） ---------- */
#rmRoot{position:fixed;inset:0;z-index:80;display:none}
#rmRoot.on{display:block}
#rmRoot .ov-bg{position:absolute;inset:0;background:var(--ov)}
#rmRoot .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;max-height:88vh;overflow-y:auto;padding:20px 22px 26px}
.rm-url{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:10px 12px;margin:13px 0 2px}
.rm-url .u{flex:1;font-size:12px;color:var(--ink2);word-break:break-all;line-height:1.5}
.rm-copy{flex:none;font-size:12px;font-weight:700;color:var(--brand-txt);background:none;border:0;padding:4px 2px;cursor:pointer;font-family:inherit}
.rm-alt{font-size:12px;color:var(--ink3);line-height:1.65;margin-top:14px}
.rm-more{margin-top:15px;text-align:center}
/* ---------- On This Day ---------- */
.otd{background:var(--fill3);border:1px solid #2C322C;border-radius:14px;padding:14px 16px;margin-top:14px}
.otd-h{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--brand-txt);font-weight:700}
.otd-d{font-size:12px;color:var(--ink3);margin-top:3px}
.otd-l{margin-top:9px}
.otd-l div{font-size:13px;color:var(--ink);line-height:1.7;padding-left:13px;position:relative}
.otd-l div:before{content:'';position:absolute;left:2px;top:9px;width:4px;height:4px;border-radius:50%;background:var(--edge)}
.otd-f{font-size:11px;color:var(--ink3);margin-top:9px}
/* ---------- 词云 / 一句话 ---------- */
.cloud{display:flex;flex-wrap:wrap;gap:9px 13px;align-items:baseline;justify-content:center;padding:8px 2px 2px}
.cloud span{color:var(--ink);line-height:1.25}
.cloud span.hot{color:var(--brand-txt);font-weight:700}
.sum{font-size:13px;line-height:1.8;color:var(--ink)}
.sum b{color:var(--brand-txt);font-weight:700}
.sum .sub{display:block;font-size:12px;color:var(--ink3);margin-top:7px;line-height:1.7}
.sec-t2{font-size:12px;color:var(--ink3);margin-bottom:9px}
#instRoot{position:fixed;inset:0;z-index:80;display:none}
#instRoot.on{display:block}
#instRoot .ov-bg{position:absolute;inset:0;background:var(--ov)}
#instRoot .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;
  padding:8px 20px calc(28px + env(safe-area-inset-bottom));box-shadow:0 -12px 44px rgba(0,0,0,.18);
  animation:shup .26s cubic-bezier(.2,.9,.3,1)}
@keyframes shup{from{transform:translateY(22px);opacity:.4}to{transform:none;opacity:1}}
.sh-bar{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:6px auto 16px}
/* 安装 sheet 按钮：主操作深绿，次级安静 */
.btn-i{display:block;width:100%;background:var(--brand);color:var(--on);font-size:16px;font-weight:700;
  border-radius:12px;padding:14px;letter-spacing:-.01em;margin-top:16px;transition:.15s}
.btn-i:active{opacity:.75}
.btn-i.ghost-i{background:var(--brand-soft);color:var(--brand-txt);font-weight:600;margin-top:10px}
.sh-t{font-size:19px;font-weight:700;letter-spacing:-.02em}
.sh-d{font-size:13.5px;color:var(--ink2);line-height:1.55;margin:6px 0 16px}
.sh-steps{list-style:none;margin:0 0 20px;padding:0}
.sh-steps li{display:flex;align-items:flex-start;gap:12px;padding:10px 0;font-size:14.5px;line-height:1.5;
  border-bottom:1px solid var(--line)}
.sh-steps li:last-child{border-bottom:0}
.sh-n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--brand);color:var(--on);  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}

/* ---------- 庆祝：立刻、微小、不喧哗 ---------- */
#celebRoot{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .24s}
#celebRoot.on{opacity:1}
.cb{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 30px;border-radius:22px;
  background:var(--pop);border:1px solid var(--line2);color:var(--ink);text-align:center;max-width:280px;
  box-shadow:0 24px 60px -12px rgba(0,0,0,.6);
  transform:scale(.94);animation:cbpop .34s cubic-bezier(.2,1.2,.3,1) forwards}
@keyframes cbpop{to{transform:none}}
.cb-ring{width:52px;height:52px;border-radius:50%;background:var(--brand);color:var(--on);  display:flex;align-items:center;justify-content:center}
.cb-t{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.45}
.cb-s{font-size:13px;color:var(--on-dim)}
@keyframes cbdraw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.cb,.cb-ring svg path{animation:none}}
.cr-t{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink3);text-transform:uppercase;white-space:nowrap}
.cr-v{font-size:12px;font-weight:700;color:var(--brand-txt);font-variant-numeric:tabular-nums;text-align:right}

.empty-stats{text-align:center;padding:26px 8px 10px}
.empty-stats .es-t{font-size:16px;font-weight:700;margin-bottom:6px}
.empty-stats .es-d{font-size:13px;color:var(--ink3);line-height:1.7;margin-bottom:20px}
.linkbtn{font-size:12.5px;font-weight:600;color:var(--brand-txt);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--brand-line)}

/* ---------- recent ---------- */
.sec-t{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;margin:0 0 12px}
.rec{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:13.5px}
.rec:first-of-type{border-top:0}
.rec-d{width:76px;flex:none;color:var(--ink2);font-weight:500}
.rec-bar{flex:1;display:flex;gap:4px}
.rec-seg{height:6px;flex:1;border-radius:3px;background:var(--line)}
.rec-seg.on{background:var(--brand)}
.rec-seg.off{background:var(--warn-soft)}
.rec-n{width:34px;flex:none;text-align:right;font-weight:700;color:var(--ink2)}
.rec-s{width:52px;flex:none;text-align:right;font-size:11px;font-weight:700;letter-spacing:.03em}
.rec-s.ok{color:var(--brand-txt)}
.rec-s.no{color:var(--warn)}

/* ---------- overlay ---------- */
.ov{position:fixed;inset:0;background:var(--ov);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
.ov-card{background:var(--card);border-radius:24px;width:100%;max-width:520px;padding:26px 22px 22px;box-shadow:0 24px 60px -12px rgba(0,0,0,.5);margin:auto}
.ov-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.ov-t{font-size:21px;font-weight:700;letter-spacing:-.015em}
.ov-time{font-size:12px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.ov-d{font-size:13px;color:var(--ink2);margin:0 0 20px;line-height:1.6}
.ov-item{padding:15px 0;border-top:1px solid var(--line)}
.ov-item:first-of-type{border-top:0;padding-top:0}
.ov-q{display:flex;gap:11px;margin-bottom:12px}
.ov-idx{font-size:11px;font-weight:700;color:var(--ink3);width:18px;flex:none;padding-top:3px}
.ov-tx{flex:1;font-size:15.5px;font-weight:600;line-height:1.5;word-break:break-word}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pick.one{grid-template-columns:1fr}
.pk{height:44px;border-radius:11px;border:1.5px solid var(--brand-edge2);background:var(--brand-soft);font-size:14px;font-weight:600;color:var(--brand-txt);transition:.15s}
.pk:hover{border-color:var(--edge)}
.pk.on-ok{background:var(--brand);border-color:var(--brand);color:var(--on)}
.pk.on-no{background:var(--warn);border-color:var(--warn);color:#fff}
.note{margin-top:20px}
.note label{display:block;font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.04em;margin-bottom:8px}
.note textarea{width:100%;background:var(--fill3);border-radius:12px;padding:12px 13px;min-height:70px;resize:vertical;font-size:14px;line-height:1.6;border:1.5px solid transparent;transition:.15s}
.note textarea:focus{border-color:var(--brand);background:var(--fill3)}
.ov-foot{margin-top:22px}
.ov-warn{font-size:12px;color:var(--warn);text-align:center;margin-top:11px;font-weight:600;height:16px}

/* ---------- 首次 briefing：一眼看全，读完就走 ---------- */
#briefRoot{position:fixed;inset:0;z-index:86;display:none}
#briefRoot.on{display:flex;align-items:center;justify-content:center;padding:20px;
  background:var(--ov);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.br{background:var(--card);border-radius:24px;width:100%;max-width:400px;padding:24px 22px 20px;
  box-shadow:0 24px 60px -12px rgba(0,0,0,.5);animation:brpop .28s cubic-bezier(.2,.9,.3,1)}
@keyframes brpop{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.br{animation:none}}
.br-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.br-g{font-size:21px;font-weight:700;letter-spacing:-.02em}
.br-s{font-size:13.5px;color:var(--ink2);line-height:1.6;margin-top:5px}
.br-x{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand-txt);
  display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1}
.br-x:active{opacity:.7}
.br-list{list-style:none;margin:18px 0 0;padding:15px 0 2px;border-top:1px solid var(--line)}
.br-list li{display:flex;gap:11px;align-items:flex-start;padding:8px 0;font-size:14.5px;line-height:1.5}
.br-n{flex:none;width:20px;height:20px;border-radius:50%;background:var(--brand-soft);color:var(--brand-txt);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.br-foot{margin-top:16px;font-size:12px;color:var(--ink3);line-height:1.6;text-align:center}

/* ---------- 非工作时段的一句话：不评价，只接住 ---------- */
.night{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2);
  background:var(--fill3);border-radius:12px;padding:10px 12px;margin-bottom:14px;line-height:1.5}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--bg);border-radius:12px;padding:11px 18px;font-size:13.5px;font-weight:600;z-index:90;opacity:0;transition:.22s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

var LANG = 'zh';
function t(k){ var d=T[LANG]; return d[k]!==undefined ? d[k] : (T.zh[k]!==undefined?T.zh[k]:k); }

/* =========================================================
   工具
   ========================================================= */
function pad(n){ return n<10 ? '0'+n : ''+n; }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDays(d,n){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function parseYmd(k){ var p=k.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function todayKey(){ return ymd(new Date()); }
function nowMin(){ var d=new Date(); return d.getHours()*60+d.getMinutes(); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtLeft(mins){
  if(mins<0) mins=0;
  var h=Math.floor(mins/60), m=mins%60;
  if(LANG==='en') return (h? h+'h ':'')+pad(m)+'m';
  return (h? h+' 小时 ':'')+pad(m)+' 分';
}
function fmtDate(d){
  if(LANG==='en'){ return (d.getMonth()+1)+'/'+d.getDate(); }
  return (d.getMonth()+1)+'/'+d.getDate();
}
function fmtMonth(d){
  if(LANG==='en'){ return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]; }
  return (d.getMonth()+1)+'月';
}
function wdShort(d){
  if(LANG==='en') return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  return ['日','一','二','三','四','五','六'][d.getDay()];
}
function fmtStamp(iso){
  var d=new Date(iso); return pad(d.getHours())+':'+pad(d.getMinutes());
}
function weekStart(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); var w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; }

/* =========================================================
   数据层
   ========================================================= */
var DB = { days:{} , demoKeys:[], carry:null };

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var o=JSON.parse(raw); DB.days = o.days||{}; DB.demoKeys = o.demoKeys||[]; DB.carry = o.carry||null; }
  }catch(e){ DB={days:{},demoKeys:[],carry:null}; }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({days:DB.days, demoKeys:DB.demoKeys, carry:DB.carry})); }catch(e){}
}
/* 昨天没推进的带过来：只在今天还是空白时落笔，不覆盖已经想好的 */
function takeCarry(){
  var c = DB.carry;
  if(!c || !c.items || !c.items.length) return 0;
  if(c.date !== todayKey()) return 0;
  var r = peek(todayKey());
  if(r && taskList(r).length) return 0;
  var rr = rec(todayKey());
  rr.tasks = c.items.map(function(x){ return { text:x, done:false, carried:true }; });
  if(!rr.writtenAt) rr.writtenAt = new Date().toISOString();
  rr.carriedFrom = c.from || null;
  DB.carry = null;
  save();
  return rr.tasks.length;
}
function carryCount(r){
  if(!r || !r.tasks) return 0;
  return r.tasks.filter(function(x){ return x && x.carried && x.text && String(x.text).trim(); }).length;
}
function rec(k){
  if(!DB.days[k]) DB.days[k] = { tasks:[], checkin:null, writtenAt:null };
  return DB.days[k];
}
function peek(k){ return DB.days[k] || null; }

function taskList(r){
  if(!r || !r.tasks) return [];
  return r.tasks.filter(function(x){ return x && x.text && String(x.text).trim(); });
}
function isChecked(k){ var r=peek(k); return !!(r && r.checkin); }

/* 当天处于哪个阶段 */
function phaseOf(k){
  var today = todayKey();
  if(isChecked(k)) return 'sealed';
  if(k > today) return 'future';
  if(k < today) return 'missed';
  var m = nowMin();
  if(m < PLAN_MIN) return 'plan';
  if(m < CHECK_MIN) return 'exec';
  return 'check';
}

/* 某天统计：planned / done / completion(0-1|null) / checked */
function dayStat(k){
  var r = peek(k);
  if(!r) return { planned:0, done:0, completion:null, checked:false };
  if(r.checkin){
    var res = r.checkin.results||[];
    var done = res.filter(Boolean).length;
    return { planned:res.length, done:done, completion: res.length? done/res.length : null, checked:true };
  }
  var n = taskList(r).length;
  return { planned:n, done:0, completion: n? 0 : null, checked:false };
}

/* 首次有记录的日期 */
function firstKey(){
  var ks = Object.keys(DB.days).filter(function(k){
    var r=DB.days[k];
    return (r.tasks && taskList(r).length) || r.checkin;
  }).sort();
  return ks.length? ks[0] : null;
}

/* 连续归档天数 */
function streak(){
  var n=0, d=new Date();
  if(!isChecked(ymd(d))) d=addDays(d,-1);
  for(var i=0;i<3650;i++){
    var k=ymd(d);
    if(isChecked(k)){ n++; d=addDays(d,-1); } else break;
  }
  return n;
}

  var html = header() + seg() + (S.view==='today' ? viewToday()+otdCard()+sdCard() : viewStats());
  document.getElementById('shell').innerHTML = html;
  bindShell();
  renderOverlay();

  var days = DB.days;

    var r = days[k]; return !!(r && (r.tasks || r.checkin));
  }).sort();

/* 中文不做真分词：按短语切块 + 长句切 2-gram，够用且不引入依赖 */
var STOPW = {'今天':1,'明天':1,'昨天':1,'一个':1,'一下':1,'这个':1,'那个':1,'什么':1,'可以':1,
  '没有':1,'就是':1,'自己':1,'还有':1,'然后':1,'因为':1,'所以':1,'但是':1,'已经':1,'不要':1,
  '需要':1,'有点':1,'真的':1,'感觉':1,'现在':1,'时候':1,'有些':1,'一些':1,'不会':1,'知道':1,
  '觉得':1,'这些':1,'那些':1,'怎么':1,'这样':1,'那样':1,'之后':1,'之前':1,'第一':1,'第二':1,'第三':1};
function bumpW(m,w){ m[w] = (m[w]||0)+1; }
function collectW(s, m){
  var parts = String(s||'').split(/[^一-龥A-Za-z0-9]+/);
  for(var i=0;i<parts.length;i++){
    var p = parts[i]; if(!p) continue;
    if(/^[一-龥]+$/.test(p)){
      if(p.length>=2 && p.length<=6) bumpW(m,p);
      else if(p.length>6){ for(var j=0;j+2<=p.length;j++) bumpW(m, p.substr(j,2)); }
    } else if(p.length>=2){ bumpW(m, p.toLowerCase()); }
  }
}
function wordsIn(ks){
  var m = {};
  ks.forEach(function(k){
    var r = DB.days[k]; if(!r) return;
    (r.tasks||[]).forEach(function(x){ if(x && x.text) collectW(x.text, m); });
    if(r.checkin && r.checkin.note) collectW(r.checkin.note, m);
  });
  var out = [];
  Object.keys(m).forEach(function(w){
    if(STOPW[w]) return;
    if(m[w] < 2) return;          /* 只出现一次的不算「反复出现」 */
    out.push({ w:w, n:m[w] });
  });
  out.sort(function(a,b){ return (b.n-a.n) || (b.w.length-a.w.length); });
  return out.slice(0,14);
}
function cloudCard(){
  var ks = Object.keys(DB.days).filter(function(k){
    var r = DB.days[k]; return !!(r && ((r.tasks && r.tasks.length) || r.checkin));
  });
  if(ks.length < 5) return '';    /* 数据太少，云还不成立 */
  var ws = wordsIn(ks);
  if(ws.length < 3) return '';
  var max = ws[0].n, min = ws[ws.length-1].n;
  var h = '<section class="card"><div class="sec-t">'+esc(t('cw_t'))+'</div>'+
    '<div class="sec-t2">'+esc(t('cw_sub'))+'</div><div class="cloud">';
  ws.forEach(function(x,i){
    var sz = (max===min) ? 15 : Math.round(13 + (x.n-min)/(max-min)*7);
    h += '<span class="'+(i<3?'hot':'')+'" style="font-size:'+sz+'px">'+esc(x.w)+'</span>';
  });
  return h+'</div></section>';
}
function sumLine(n){
  var ks = [], cN = 0, dSum = 0, pSum = 0;
  for(var i=n-1;i>=0;i--){
    var d = addDays(new Date(), -i), k = ymd(d);
    ks.push(k);
    if(isChecked(k)){ cN++; var s = dayStat(k); dSum += s.done; pSum += s.planned; }
  }
  if(!cN) return '';
  var ws = wordsIn(ks);
  var line = t('sum_line').replace('{c}', cN).replace('{p}', pSum).replace('{d}', dSum);
  if(ws.length) line += t('sum_word').replace('{w}', esc(ws[0].w)).replace('{n}', ws[0].n);
  return line;
}

function viewToday(){
  var k = todayKey(), ph = phaseOf(k);
  var carried = takeCarry();          /* 昨天没推进的，今天空白时自动带过来 */
  var r = peek(k);
  var early = isMorning(r);

  var dot='', name, hint;
  if(ph==='plan'){ name=t('ph_plan'); hint=t('left_pre')+fmtLeft(PLAN_MIN-nowMin()); }
  else if(ph==='exec'){ name=t('ph_exec'); hint=t('left_pre2')+fmtLeft(CHECK_MIN-nowMin()); }
  else if(ph==='check'){ name=t('ph_check'); dot=' w'; hint=t('check_now'); }
  else {
    name=t('ph_sealed'); dot=' g';
    /* 夜间顶部已有「今天收好了，明天见」，副标题也已写明收尾时刻 —— 这里再写一遍就是噪音，直接留白 */
    hint = (timeSlot()==='night') ? '' : t('sealed_hint');
  }

  var h = '<section class="card">'+ nightLine(r) +
    '<div class="phase"><span class="pdot'+dot+'"></span>'+
      '<span class="pname'+(dot===' w'?' w':dot===' g'?' g':'')+'">'+name+'</span>'+
      (hint ? '<span class="phint">'+esc(hint)+'</span>' : '')+
    '</div>'+
    '<h1 class="h1">'+t('t_title')+'</h1>';

  if(ph==='sealed'){
    h += '<p class="h1-sub">'+t('sealed_at')+' '+fmtStamp(r.checkin.at)+'</p>'+ sealedList(r);
    return h+'</section>';
  }
  if(ph==='check'){
    h += '<p class="h1-sub">'+t('ov_d_note')+'</p>'+ readList(r);
    return h+'</section>';
  }

  /* 早上想清楚最理想，但全天都能写、能改、能勾 —— 想到了就写 */
  var tag = early ? ' <span class="tag ok">'+esc(t('tag_am'))+'</span>' : '';

/* 早上写下的日子打正向标记；不是早上写的就什么都不标 —— 不审判迟到 */
function isMorning(r){
  if(!r || !r.writtenAt) return false;
  var d = new Date(r.writtenAt);
  return d.getHours()*60+d.getMinutes() < PLAN_MIN;

/* 可编辑行：输入框 + （07:00 后）完成勾选 */
/* 不预先画三个空位：写完一行才露出下一行。
   上限仍是 3（超过三件就没有优先级了），下限 1 —— 一件也收 */
function editRows(r, showCheck){
  var tasks = (r && r.tasks) ? r.tasks : [];
  var filled = 0;
  for(var q=0;q<SLOTS;q++){
    if(tasks[q] && tasks[q].text && String(tasks[q].text).trim()) filled = q+1;
  }
  var h = '<div class="items">';
  for(var i=0;i<SLOTS;i++){
    var it = tasks[i] || { text:'', done:false };

    h += '<div class="item'+ghost+'" data-row="'+i+'"><span class="idx num">'+pad(i+1)+'</span>'+

      (it.carried && txt.trim() ? '<span class="tag">'+esc(t('carry_tag'))+'</span>' : '');
    if(showCheck){
      h += '<button class="check'+(it.done?' on':'')+(txt.trim()?'':' dis')+'" data-act="tick" data-i="'+i+'" aria-label="toggle">'+
        '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 6.2 L4.7 8.8 L10 3.4" fill="none" style="stroke:var(--on)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>';

/* =========================================================
   渲染：统计
   ========================================================= */
function viewStats(){
  var first = firstKey();
  var tk = todayKey();

  if(!first){
    return '<section class="card"><div class="empty-stats">'+
      '<div class="es-t">'+t('es_t')+'</div>'+
      '<div class="es-d">'+t('es_d')+'</div>'+
      '</div>'+
      '<button class="btn ghost" data-act="demo">'+t('es_demo')+'</button>'+
      '</section>';
  }

  /* 指标 */
  var allDone=0, allPlan=0;
  Object.keys(DB.days).forEach(function(k){
    var s = dayStat(k);
    if(s.checked && s.planned){ allDone+=s.done; allPlan+=s.planned; }
  });
  var completion = allPlan? Math.round(allDone/allPlan*100) : null;

  var exp = [], d;
  for(d=parseYmd(first); ymd(d) < tk; d=addDays(d,1)) exp.push(ymd(d));
  var checkedN = exp.filter(isChecked).length;
  var logRate = exp.length? Math.round(checkedN/exp.length*100) : (isChecked(tk)?100:null);

  var st = streak();

  var h = '<div class="sc-row">'+
    scCard(completion===null?'—':completion+'%', t('fin_ok'), completion===null)+
    scCard(logRate===null?'—':logRate+'%', t('fin_chk'), logRate===null)+
    scCard(st, t('fin_streak'), false)+
  '</div>';

  h += '<section class="card chart-card">'+
    '<div class="seg2">'+
      periodBtn('day', t('p_day')) + periodBtn('week', t('p_week')) + periodBtn('month', t('p_month')) +
    '</div>'+
    '<div class="chart-wrap" id="cw">'+chartHTML()+'</div>'+

/* --- 汇总 --- */
function aggDaily(){
  var labels=[], comp=[], chk=[];
  var first = firstKey(), tk = todayKey();
  for(var i=13;i>=0;i--){
    var d = addDays(new Date(), -i), k = ymd(d);
    if(first && k < first){ labels.push(fmtDate(d)); comp.push(null); chk.push(null); continue; }
    var s = dayStat(k);
    labels.push(fmtDate(d));
    comp.push(s.completion);
    if(s.checked) chk.push(1);
    else chk.push(k===tk ? null : 0);
  }
  return { labels:labels, comp:comp, chk:chk, title:t('p_day_t') };
}
function aggWeekly(){
  var labels=[], comp=[], chk=[];
  var first = firstKey(), tk = todayKey();
  var cs = weekStart(new Date());
  for(var i=7;i>=0;i--){
    var ws = addDays(cs, -7*i), we = addDays(ws, 6);
    labels.push(fmtDate(ws));
    var dSum=0,pSum=0,cN=0,any=false;
    for(var j=0;j<7;j++){
      var d = addDays(ws,j), k = ymd(d);
      if(k > tk) break;
      if(first && k < first) continue;
      any = true;
      if(isChecked(k)){ cN++; var s=dayStat(k); dSum+=s.done; pSum+=s.planned; }
    }
    comp.push(pSum? dSum/pSum : null);
    chk.push(any? cN/7 : null);
  }
  return { labels:labels, comp:comp, chk:chk, title:t('p_week_t') };
}
function aggMonthly(){
  var labels=[], comp=[], chk=[];
  var first = firstKey(), tk = todayKey();
  var now = new Date();
  for(var i=5;i>=0;i--){
    var ms = new Date(now.getFullYear(), now.getMonth()-i, 1);
    labels.push(fmtMonth(ms));
    var dSum=0,pSum=0,cN=0,days=0,any=false;
    var dim = new Date(ms.getFullYear(), ms.getMonth()+1, 0).getDate();
    for(var j=1;j<=dim;j++){
      var d = new Date(ms.getFullYear(), ms.getMonth(), j), k = ymd(d);
      if(k > tk) break;
      if(first && k < first) continue;
      any = true; days++;
      if(isChecked(k)){ cN++; var s=dayStat(k); dSum+=s.done; pSum+=s.planned; }
    }
    comp.push(pSum? dSum/pSum : null);
    chk.push(any&&days? cN/days : null);
  }
  return { labels:labels, comp:comp, chk:chk, title:t('p_month_t') };
}

/* --- SVG 折线 --- */
var geom = null;
function segments(vals){
  var out=[], cur=[];
  for(var i=0;i<vals.length;i++){
    var v=vals[i];
    if(v===null||v===undefined||isNaN(v)){ if(cur.length) out.push(cur); cur=[]; }
    else cur.push([i,v]);
  }
  if(cur.length) out.push(cur);
  return out;
}
function chartHTML(){
  var data = S.period==='day'? aggDaily() : S.period==='week'? aggWeekly() : aggMonthly();
  var W=680,H=300,PL=48,PR=22,PT=24,PB=42;
  var iw=W-PL-PR, ih=H-PT-PB, n=data.labels.length;
  var X=function(i){ return n<=1? PL+iw/2 : PL+iw*i/(n-1); };
  var Y=function(v){ return PT+ih*(1-v); };
  geom = { X:X, n:n, W:W, labels:data.labels, comp:data.comp, chk:data.chk };

  var s='<defs><linearGradient id="gfill" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" style="stop-color:var(--brand-txt)" stop-opacity="0.16"/>'+
    '<stop offset="100%" style="stop-color:var(--brand-txt)" stop-opacity="0"/></linearGradient></defs>';

  /* 网格 */
  [0,.25,.5,.75,1].forEach(function(v){
    var yy=Y(v);
    s+='<line x1="'+PL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+yy.toFixed(1)+'" stroke="#242924" stroke-width="1"/>';
    s+='<text x="'+(PL-11)+'" y="'+(yy+4).toFixed(1)+'" text-anchor="end" style="fill:var(--ink3)" font-size="11" font-weight="600">'+Math.round(v*100)+'%</text>';
  });

  /* x 轴标签 */
  data.labels.forEach(function(lb,i){
    s+='<text x="'+X(i).toFixed(1)+'" y="'+(H-16)+'" text-anchor="middle" style="fill:var(--ink3)" font-size="11" font-weight="600">'+esc(lb)+'</text>';
  });

  /* 归档率（虚线，先画在底层） */
  segments(data.chk).forEach(function(sg){
    var d='';
    sg.forEach(function(p,idx){ d += (idx?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)+' '; });
    s+='<path d="'+d+'" fill="none" style="stroke:var(--edge)" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round"/>';
  });

  /* 完成率（实线 + 面积） */
  segments(data.comp).forEach(function(sg){
    var d='';
    sg.forEach(function(p,idx){ d += (idx?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)+' '; });
    if(sg.length>1){
      s+='<path d="'+d+'L '+X(sg[sg.length-1][0]).toFixed(1)+' '+Y(0).toFixed(1)+' L '+X(sg[0][0]).toFixed(1)+' '+Y(0).toFixed(1)+' Z" fill="url(#gfill)" stroke="none"/>';
    }
    s+='<path d="'+d+'" fill="none" style="stroke:var(--brand-txt)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>';
    sg.forEach(function(p){
      s+='<circle cx="'+X(p[0]).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="3.6" style="fill:var(--brand-txt);stroke:var(--bg)" stroke-width="2.4"/>';
    });
  });

  return '<div class="chart-read"><span class="cr-t">'+esc(data.title)+'</span><span class="cr-v" id="crv"></span></div>'+
    '<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+s+'</svg>';
}

/* 勾选完成状态（仅 07:00 后） */
function toggleDone(i){
  var r = rec(todayKey());
  while(r.tasks.length < SLOTS) r.tasks.push({text:'',done:false});
  var it = r.tasks[i];
  if(!it || !it.text || !it.text.trim()) return;
  it.done = !it.done;
  save(); render();
}

function setTask(i, text){
  var r = rec(todayKey());
  while(r.tasks.length < SLOTS) r.tasks.push({text:'',done:false});
  if(!r.tasks[i]) r.tasks[i] = {text:'',done:false};
  r.tasks[i].text = text;
  if(!r.tasks[i].text.trim()) r.tasks[i].done = false;
  var any = r.tasks.some(function(x){ return x && x.text && x.text.trim(); });
  if(any && !r.writtenAt) r.writtenAt = new Date().toISOString();
  if(!any) r.writtenAt = null;
  save();
}

function seal(){
  var r = rec(todayKey()), tasks = taskList(r);

  /* picks 对齐到非空要事：只存在 tasks[] 里的才算数。
     1 = 推进了，0 = 没推进（不点也算，明天带走） */
  var results = [], carry = [];
  for(var i=0;i<tasks.length;i++){
    var ok = S.picks[i] === 1;
    results.push(ok);
    if(!ok) carry.push(tasks[i].text);
  }

  r.checkin = { at:new Date().toISOString(), results:results, note:(S.note||'').trim() };
  r.tasks = tasks;               /* 丢掉空槽位，让统计口径干净 */
  /* 没推进的不是欠账，是明天的事 —— 只在明天还是空白时落笔 */
  DB.carry = carry.length ? { date:ymd(addDays(new Date(),1)), items:carry, from:todayKey() } : null;
  save();
  S.picks=[]; S.note='';
  render();
  celebrate(results.filter(Boolean).length, tasks.length);
  maybeBrief(2100);       /* 首屏被收尾层占了的话，庆祝走完再讲一次规则 */
}

/* =========================================================
   庆祝 —— 福格模型的最后一步，必须立刻、必须小
   不做徽章墙、不做排行榜。归档动作本身就是成就，
   哪怕今天一件都没做完（那时.Show Empathy，不评价）
   ========================================================= */
/* 每次随机一句话 —— 全做完夸当下，没做完就把劲留给下次（≤6 句，不刷屏） */
var CHEERS_DONE = [
  '全部拿下，今天很硬核',
  '三发三中，漂亮',
  '说到做到，这就是复利',
  '今天一个都没溜走',
  '干净利落，收工',
  '这个完成度，值得记一笔'
];
var CHEERS_PART = [
  '完成的部分已经算数了',
  '推进过，就不算白过',
  '没做完 ≠ 没做，明天接着来',
  '剩下的留给明天，也是安排',
  '诚实归档本身，就是本事',
  '下一发，明天打中它'
];
function pick(arr){
  return arr[Math.floor(Math.random() * arr.length)];
}
function celebrate(doneN, totalN){
  var el = document.getElementById('celebRoot');
  if(!el) return;
  var streak = consecutiveSealed();
  var line = t(totalN? 'cb_done' : 'cb_empty')
               .replace('{d}', doneN).replace('{t}', totalN);
  var allDone = totalN > 0 && doneN === totalN;
  var sub = pick(allDone ? CHEERS_DONE : CHEERS_PART);
  if(streak > 1) sub += ' · ' + t('cb_streak').replace('{n}', streak);

  el.innerHTML =
    '<div class="cb">'+
      '<div class="cb-ring">'+
        '<svg viewBox="0 0 44 44" width="44" height="44">'+
          '<path d="M12 23.5l7 7L32 15" fill="none" stroke="currentColor" stroke-width="3.2" '+
            'stroke-linecap="round" stroke-linejoin="round" '+
            'style="stroke-dasharray:44;stroke-dashoffset:44;animation:cbdraw .42s .06s forwards"/>'+
        '</svg>'+
      '</div>'+
      '<div class="cb-t">'+esc(line)+'</div>'+
      '<div class="cb-s">'+esc(sub)+'</div>'+
    '</div>';
  el.classList.add('on');
  clearTimeout(el.__t);
  el.__t = setTimeout(hideCeleb, 1900);
}
function hideCeleb(){
  var el = document.getElementById('celebRoot');
  if(!el) return;
  el.classList.remove('on');
  clearTimeout(el.__t);
  setTimeout(function(){ el.innerHTML = ''; }, 260);
}
/* 连续归档天数：从今天往前数，断了一天就停 —— 但从不"清零处罚" */
function consecutiveSealed(){
  var days = DB.days, n = 0, d = new Date();
  for(var i=0;i<400;i++){
    var k = ymd(d);
    var r = days[k];
    if(r && r.checkin && r.checkin.at) n++;
    else if(i > 0) break;          /* 今天还没归档不计入，也不算断 */
    d.setDate(d.getDate()-1);
  }
  return n;
}

/* --- 图表读数（悬停/触摸时更新右上角数字，不做浮层，避免遮挡） --- */
function attachTip(wrap){
  if(!wrap || wrap.__tip) return;
  wrap.__tip = true;
  var svg = wrap.querySelector('.chart-svg');
  var out = wrap.querySelector('#crv');
  if(!svg || !out || !geom) return;
  var move = function(ev){
    var rect = svg.getBoundingClientRect();
    var cx = (ev.touches && ev.touches[0]) ? ev.touches[0].clientX : ev.clientX;
    var px = (cx - rect.left) / rect.width * geom.W;
    var best=0, bd=1e9;
    for(var i=0;i<geom.n;i++){ var dd=Math.abs(geom.X(i)-px); if(dd<bd){ bd=dd; best=i; } }
    var cv = geom.comp[best], hv = geom.chk[best];
    out.textContent = geom.labels[best] + ' · ' + t('lg_done') + ' ' +
      (cv===null||cv===undefined? '—' : Math.round(cv*100)+'%') + ' · ' + t('lg_chk') + ' ' +
      (hv===null||hv===undefined? '—' : Math.round(hv*100)+'%');
  };
  var leave = function(){ out.textContent = ''; };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', leave);
  svg.addEventListener('touchstart', move, {passive:true});
  svg.addEventListener('touchend', leave);
}

/* --- 示例数据 --- */
function loadDemo(){
  var today = new Date();
  var keys=[];
  for(var i=29;i>=0;i--){
    var d = addDays(today, -i), k = ymd(d);
    if(DB.days[k] && (taskList(DB.days[k]).length || DB.days[k].checkin)) continue;
    if(i===0) continue; /* 今天留空，保持真实 */
    var n = 3;
    var titles = ['深度工作 90 分钟','与关键人沟通','运动 30 分钟','读完一章','复盘昨日','推进主线任务','写 500 字'];
    var made = [];
    for(var j=0;j<n;j++){
      var txt = titles[(i + j*3) % titles.length];
      made.push({ text:txt, done:false });
    }
    var res=[]; 
    for(var j2=0;j2<n;j2++){ res.push(Math.random() > 0.3); }
    made.forEach(function(x,idx){ x.done = res[idx]; });
    var hh = 6, mm = 20 + (i*7)%35;
    var at = new Date(d.getFullYear(),d.getMonth(),d.getDate(),18, (i*11)%50);
    DB.days[k] = {
      tasks: made,
      writtenAt: new Date(d.getFullYear(),d.getMonth(),d.getDate(),hh,mm).toISOString(),
      checkin: { at: at.toISOString(), results: res, note:'' }
    };
    keys.push(k);
  }
  DB.demoKeys = DB.demoKeys.concat(keys);
  save(); toast(t('toast_demo')); render();
}
function clearDemo(){
  DB.demoKeys.forEach(function(k){ delete DB.days[k]; });
  DB.demoKeys = [];
  save(); toast(t('toast_demo_off')); render();
}

/* --- toast --- */
var toastTimer=null;
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 1900);
}

/* --- tick --- */
var lastPhase = null, lastMin = -1;
function tick(){
  /* 正在输入时绝不重绘，否则会打断用户 */
  var ae = document.activeElement;
  if(ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA')) return;

  applyTheme();          /* 跨过 18:00 / 05:00 就换肤，不用刷新 */
  var ph = phaseOf(todayKey()), m = nowMin();
  if(ph !== lastPhase){ lastPhase = ph; lastMin = m; render(); return; }
  /* 今日页倒计时按分钟刷新即可 */
  if(S.view==='today' && m !== lastMin){ lastMin = m; render(); }
}
