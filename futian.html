<html lang="zh-CN">

<meta charset="utf-8">

<title>每日福田</title>

<style>
:root{
  --paper:#F7EFE0; --paper2:#FFFBF2; --card:#FFFDF7;
  --ink:#3A2E1F; --ink2:#6B5B45; --ink3:#93816A;
  --gold:#B8860B; --gold-d:#8A6508; --gold-soft:#F5E7C4;
  --cinnabar:#B93A26; --cinnabar-soft:#F8E3DC;
  --field:#6B8E5A; --field-soft:#E7EFDC;
  --line:#E6D9BE; --line2:#D8C7A4;
  --shadow:0 2px 14px rgba(90,66,30,.06);
  --serif:"Songti SC","STSong","Noto Serif SC","SimSun",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
body{padding-bottom:40px;background-image:radial-gradient(circle at 12% 8%,rgba(184,134,11,.05),transparent 40%),radial-gradient(circle at 88% 92%,rgba(107,142,90,.05),transparent 40%)}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}

/* 顶部 */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:20px 0 14px}
.brand{font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:2px;color:var(--ink);display:flex;align-items:center;gap:9px}
.seal{width:30px;height:30px;flex:none;border:2px solid var(--cinnabar);border-radius:5px;color:var(--cinnabar);font-family:var(--serif);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;transform:rotate(-3deg)}
.brand-sub{font-family:var(--serif);font-size:11px;color:var(--ink3);letter-spacing:3px;margin-top:2px}
.hdr-r{display:flex;align-items:center;gap:8px}
.lang{border:1px solid var(--line2);background:var(--paper2);color:var(--ink2);border-radius:18px;padding:6px 13px;font-size:12px;cursor:pointer;font-family:var(--sans);text-decoration:none;display:inline-flex;align-items:center}
.lang.back-home{color:var(--gold-d);border-color:var(--gold-soft);white-space:nowrap}
.lang.back-home:hover{border-color:var(--gold);background:var(--paper2)}
.lang:active{transform:scale(.96)}

/* Tab */
.tabs{display:flex;gap:4px;background:var(--gold-soft);border-radius:12px;padding:4px;margin-bottom:16px}
.tab{flex:1;text-align:center;padding:9px 0;border:0;background:none;border-radius:9px;font-size:13px;color:var(--gold-d);cursor:pointer;font-family:var(--sans)}
.tab.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}

/* 卡 */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-t{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:4px}
.card-sub{font-size:12px;color:var(--ink3);line-height:1.6;margin-bottom:14px}

/* 功德概览 */
.overview{background:linear-gradient(150deg,#FFF9EA,#F3E3C0);border:1px solid var(--line2)}
.ov-top{display:flex;justify-content:space-between;align-items:flex-start}
.merit-num{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--gold-d);line-height:1}
.merit-lab{font-size:12px;color:var(--ink2);margin-top:4px}
.rank{text-align:right}
.rank-name{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--cinnabar)}
.rank-lab{font-size:11px;color:var(--ink3);margin-top:3px}
.ov-stats{display:flex;gap:0;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line2)}
.ov-stat{flex:1;text-align:center;position:relative}
.ov-stat+.ov-stat:before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;background:var(--line)}
.ov-v{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--ink)}
.ov-k{font-size:11px;color:var(--ink3);margin-top:3px}

/* 福田可视化 */
.field-vis{margin-top:16px;background:var(--field-soft);border-radius:12px;padding:14px}
.field-stage{display:flex;align-items:center;gap:12px}
.field-emoji{width:52px;height:52px;flex:none;display:flex;align-items:center;justify-content:center}
.field-info{flex:1}
.field-name{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--field)}
.field-desc{font-size:11px;color:var(--ink2);margin-top:3px;line-height:1.5}
.field-bar{height:7px;background:rgba(107,142,90,.15);border-radius:5px;margin-top:11px;overflow:hidden}
.field-bar>i{display:block;height:100%;background:var(--field);border-radius:5px;transition:width .5s}

/* 四问 */
.q{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px}
.q.done{border-color:var(--field);background:var(--field-soft)}
.q-head{display:flex;align-items:center;gap:10px}
.q-badge{width:38px;height:38px;flex:none;border-radius:50%;background:var(--gold-soft);display:flex;align-items:center;justify-content:center;overflow:hidden}
.q.done .q-badge{background:var(--field-soft)}
/* 四个面平行：各占一格、各自亮，不做向上阶梯 */
.dim-sec{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line2)}
.dim-t{font-size:11px;color:var(--ink3);margin-bottom:10px;letter-spacing:.03em}
.dim-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.dim-grid.full{grid-template-columns:repeat(2,1fr);gap:10px}
.dim{border:1px solid var(--line2);border-radius:10px;padding:10px 5px;text-align:center;background:var(--paper2);transition:.18s}
.dim.on{border-color:var(--gold);background:var(--gold-soft)}
.dim-ic{display:flex;justify-content:center;opacity:.4;transition:opacity .3s}
.dim.on .dim-ic{opacity:1}
.dim-n{font-family:var(--serif);font-size:12px;font-weight:700;color:var(--ink3);margin-top:4px}
.dim.on .dim-n{color:var(--gold-d)}
.dim-lv{font-size:11px;color:var(--ink3);margin-top:2px}
.dim.on .dim-lv{color:var(--cinnabar);font-weight:600}
.dim-cnt{font-size:11px;color:var(--ink3);margin-top:5px}
.dim-cnt span{font-size:9px;margin-left:1px}
.dim-bar{height:4px;background:var(--line2);border-radius:2px;margin-top:8px;overflow:hidden}
.dim-bar i{display:block;height:100%;background:var(--gold);border-radius:2px;transition:width .3s}
.dim-next{font-size:10px;color:var(--ink3);margin-top:5px;line-height:1.4}
.q-name{font-family:var(--serif);font-size:13px;color:var(--cinnabar);font-weight:700}
.q-q{font-size:14px;color:var(--ink);margin-top:8px;line-height:1.5;font-weight:600}
.q-hint{font-size:11px;color:var(--ink3);margin-top:3px;line-height:1.5}
.q-input{width:100%;margin-top:10px;border:0;border-bottom:1px dashed var(--line2);background:transparent;font-family:var(--serif);font-size:14px;color:var(--ink);padding:6px 0;outline:none;resize:none;line-height:1.5}
.q-input:focus{border-bottom-color:var(--gold)}
.q-input::placeholder{color:var(--ink3);font-family:var(--sans);font-size:12px}
.q-merit{font-size:11px;color:var(--gold-d);margin-top:6px;display:none}
.q.done .q-merit{display:block}

/* 法语 */
.dharma{background:linear-gradient(160deg,#FBF3E2,#F6E9CC);border-left:3px solid var(--gold)}
.dharma-q{font-family:var(--serif);font-size:17px;line-height:1.8;color:var(--gold-d);text-align:center;padding:6px 4px}
.dharma-from{text-align:center;font-size:11px;color:var(--ink3);margin-top:8px}

/* 回向 */
.ded-text{font-family:var(--serif);font-size:14px;color:var(--ink);line-height:1.7;min-height:22px}
.ded-empty{color:var(--ink3);font-family:var(--sans);font-size:12px}
.ded-edit{background:none;border:0;color:var(--gold-d);font-size:12px;padding:8px 0 0;cursor:pointer;font-family:var(--sans)}
.ded-edit:hover{text-decoration:underline}

/* 按钮 */
.btn{width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--sans);background:var(--gold);color:#fff;letter-spacing:1px}
.btn:active{transform:scale(.99)}
.btn.red{background:var(--cinnabar)}
.btn.ghost{background:var(--paper2);color:var(--ink2);border:1px solid var(--line2);font-weight:500}
.btn.sm{padding:10px;font-size:13px}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}

/* 回看 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.cal-d{aspect-ratio:1;border-radius:8px;background:var(--paper2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink3);position:relative}
.cal-d.has{background:var(--field-soft);border-color:var(--field);color:var(--field);font-weight:700}
.cal-d.has:after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.cal-d.open{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-d);box-shadow:inset 0 0 0 1px var(--gold)}
.day-detail{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.day-detail-h{font-size:12px;color:var(--gold-d);font-weight:600;margin-bottom:8px}
.day-q{display:flex;gap:8px;margin:7px 0;font-size:12px;line-height:1.6}
.day-q b{color:var(--cinnabar);flex:none;font-weight:600}
.day-q span{color:var(--ink2)}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0 4px}
.cal-head span{text-align:center;font-size:10px;color:var(--ink3)}
.month-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.month-nav b{font-family:var(--serif);font-size:15px}
.month-nav button{border:0;background:var(--gold-soft);color:var(--gold-d);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:16px}

/* 海报弹层 */
.mask{position:fixed;inset:0;background:rgba(40,30,15,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.mask.on{display:flex}
.modal{background:var(--paper2);border-radius:16px;padding:18px;max-width:360px;width:100%;text-align:center}
.modal img{width:100%;border-radius:10px;margin:12px 0}
.modal-x{float:right;border:0;background:none;font-size:20px;color:var(--ink3);cursor:pointer;line-height:1}

/* toast */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper2);padding:10px 20px;border-radius:22px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.foot{text-align:center;font-size:11px;color:var(--ink3);margin-top:24px;line-height:1.8}
.foot a{color:var(--gold-d);text-decoration:none}
@media(min-width:560px){body{max-width:520px;margin:0 auto;box-shadow:0 0 60px rgba(90,66,30,.08)}}
</style>

/* ===================== 工具 ===================== */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return n<10?'0'+n:''+n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayKey(){return ymd(new Date());}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
function fmtDate(k){var p=k.split('-');return LANG==='zh'?(parseInt(p[1])+'月'+parseInt(p[2])+'日'):(p[1]+'/'+p[2]);}

/* ===================== 数据 ===================== */
var KEY='futian.v1';
var S={ view:'today', month:null, editDed:false, justPlanted:false };
var DB;
function blank(){return {days:{},dedications:{},lang:''};}
function load(){
  try{DB=JSON.parse(localStorage.getItem(KEY)||'null')||blank();}
  catch(e){DB=blank();}
  if(!DB.days)DB.days={};
  if(!DB.dedications)DB.dedications={};
  try{var lg=localStorage.getItem('ft.lang');if(lg==='en'||lg==='zh')LANG=lg;}catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}

/* 一天的回答：[四问文本] */
function dayAnswers(k){var d=DB.days[k];return (d&&d.answers)||['','','',''];}
function answerCount(k){var a=dayAnswers(k),n=0;for(var i=0;i<4;i++)if(a[i]&&a[i].trim())n++;return n;}
/* 单日功德 = 当天答了几问，答 4 个就是 4，不做任何加成 */
function dayMerit(k){return answerCount(k);}
function totalMerit(){var m=0;for(var k in DB.days)if(DB.days.hasOwnProperty(k))m+=answerCount(k);return m;}
function totalQ(){var n=0;for(var k in DB.days)if(DB.days.hasOwnProperty(k))n+=answerCount(k);return n;}
/* 四维度平行计量：每个菩萨各自累计「有内容的天数」，互不干扰。
   四菩萨是四个平行的修行面，不是一条向上升的阶梯——不合并、不排序、不互相解锁。 */
function dimDays(i){var n=0;for(var k in DB.days)if(DB.days.hasOwnProperty(k)){var a=DB.days[k].answers||[];if(a[i]&&a[i].trim())n++;}return n;}
function dimToday(i){var a=dayAnswers(todayKey());return (a[i]&&a[i].trim())?1:0;}
/* 连续日课：从今天（或昨天）往前数有输入的连续天数；断了就重新起算，不惩罚 */
function streak(){
  var today=new Date(),start=answerCount(ymd(today))>0?0:1,n=0;
  for(var i=start;i<400;i++){var k=ymd(addDays(today,-i));if(answerCount(k)>0)n++;else break;}
  return n;
}
function practiceDays(){var n=0;for(var k in DB.days)if(DB.days.hasOwnProperty(k)&&answerCount(k)>0)n++;return n;}
/* 阶位：累计功德门槛 */
/* 福田整体长势：用累计功德（四维之和），这是「整块地有多肥」，与四个面各自的高低无关 */
var FIELD_NEED=[0,20,60,150,300];
function fieldOf(m){var f=0;for(var i=0;i<FIELD_NEED.length;i++)if(m>=FIELD_NEED[i])f=i;return f;}

/* 每个维度各自的天数门槛与等级名：7/21/49 天。四个面平行走，各自亮各自的，不互相解锁 */
var DIM_NEED=[0,7,21,49];
function dimLv(i){var n=dimDays(i),lv=0;for(var j=0;j<DIM_NEED.length;j++)if(n>=DIM_NEED[j])lv=j;return lv;}
function dimLvName(i){return t('dimLv')[i][dimLv(i)];}
function dimNextNeed(i){var lv=dimLv(i);return lv>=DIM_NEED.length-1?0:(DIM_NEED[lv+1]-dimDays(i));}
/* 四维平行卡：四个面各排一格，谁写得多谁亮；不做「第几阶」的串联 */
function dimGridHTML(full){
  var h='<div class="dim-grid'+(full?' full':'')+'">';
  for(var i=0;i<4;i++){
    var n=dimDays(i),lv=dimLv(i),nx=dimNextNeed(i),on=lv>0||dimToday(i);
    var pct=nx?Math.round((n-DIM_NEED[lv])/((DIM_NEED[lv+1]||DIM_NEED[lv]+1)-DIM_NEED[lv])*100):100;
    h+='<div class="dim'+(on?' on':'')+'">'+
       '<div class="dim-ic">'+bodhiSVG(i,34)+'</div>'+
       '<div class="dim-n">'+t('qName')[i].split(' ')[0]+'</div>'+
       '<div class="dim-lv">'+dimLvName(i)+'</div>'+
       '<div class="dim-cnt">'+n+'<span>'+t('dimDay')+'</span></div>'+
       (full?'<div class="dim-bar"><i style="width:'+pct+'%"></i></div>'+
             '<div class="dim-next">'+(nx?t('dimNext')(nx):t('maxDim'))+'</div>':'')+
       '</div>';
  }
  return h+'</div>';
}

/* 每日法语：按日期确定性取，不清高、不占卜 */
function dharmaIdx(k){var n=0;for(var i=0;i<k.length;i++)n=(n*31+k.charCodeAt(i))%997;return n%T.zh.dharmas.length;}
function dharmaToday(){var i=dharmaIdx(todayKey());return {q:T[LANG].dharmas[i],from:T[LANG].dharmaFroms[i]};}

/* 四菩萨圣像：纯 SVG 线描（不用 emoji），四尊各有法器辨识
   0 地藏：锡杖+宝珠（示现沙门） 1 观音：净瓶+柳枝 2 文殊：智慧剑+经卷 3 普贤：六牙白象 */
function bodhiSVG(i,size){
  var s=size||38, g='#8A6508', soft='#C9A227';
  var face='<circle cx="20" cy="15" r="7.5" fill="none" stroke="'+g+'" stroke-width="1.4"/>'+
           '<path d="M12 13c0-6 4-9 8-9s8 3 8 9c0 1-1 2-2 2-1-4-3-6-6-6s-5 2-6 6c-1 0-2-1-2-2z" fill="none" stroke="'+g+'" stroke-width="1.2"/>'+
           '<path d="M17.5 16.5h.02M22.5 16.5h.02" stroke="'+g+'" stroke-width="2" stroke-linecap="round"/>'+
           '<path d="M18.5 19.5c1 1 2.5 1 3.5 0" fill="none" stroke="'+g+'" stroke-width="1"/>';
  var halo='<circle cx="20" cy="17" r="15.5" fill="none" stroke="'+soft+'" stroke-width=".8" opacity=".55"/>';
  var body='<path d="M9 40c0-8 5-13 11-13s11 5 11 13" fill="none" stroke="'+g+'" stroke-width="1.4"/>';
  var item='';
  if(i===0){ /* 地藏：锡杖（带环）+ 宝珠 */
    item='<path d="M33 6v30" stroke="'+g+'" stroke-width="1.6"/><circle cx="33" cy="6" r="2.4" fill="none" stroke="'+g+'" stroke-width="1.2"/>'+
         '<circle cx="33" cy="10" r="1.6" fill="none" stroke="'+g+'" stroke-width="1"/><circle cx="28" cy="34" r="3" fill="none" stroke="'+soft+'" stroke-width="1.2"/>';
  }else if(i===1){ /* 观音：净瓶 + 柳枝 */
    item='<path d="M7 40c-3-4-3-9 1-11l2 3 2-3c4 2 4 7 1 11z" fill="none" stroke="'+g+'" stroke-width="1.3"/>'+
         '<path d="M10 26c0-5 2-8 5-10M11 22c3-1 5-3 6-6" fill="none" stroke="'+g+'" stroke-width="1.2"/>';
  }else if(i===2){ /* 文殊：智慧剑 + 经卷 */
    item='<path d="M31 34L40 12l-3 1-8 20z" fill="none" stroke="'+g+'" stroke-width="1.4"/>'+
         '<path d="M28 33l6 3" stroke="'+g+'" stroke-width="2"/><path d="M40 12l1-4-3 2" fill="'+soft+'" stroke="'+g+'" stroke-width="1"/>';
  }else{ /* 普贤：白象（侧影） */
    item='<path d="M6 40c0-5 3-8 8-8h9c4 0 7 3 7 8" fill="none" stroke="'+g+'" stroke-width="1.3"/>'+
         '<path d="M25 32c3-2 6-1 7 2 1 3-1 6-4 6" fill="none" stroke="'+g+'" stroke-width="1.2"/>'+
         '<path d="M28 40v-3M31 40v-3" stroke="'+g+'" stroke-width="1.2"/><circle cx="30" cy="33" r="1" fill="'+g+'"/>';
  }
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 46 46" fill="none">'+halo+face+body+item+'</svg>';
}

/* 福田 SVG（纯 CSS/SVG 画，不用 emoji） */
function fieldSVG(stage){
  var c='#6B8E5A',g='#B8860B';
  if(stage===0)return '<svg width="52" height="52" viewBox="0 0 52 52"><path d="M6 40h40" stroke="'+g+'" stroke-width="2"/><path d="M8 40l6-4m12 4l6-4m8 4l6-4" stroke="'+g+'" stroke-width="1" opacity=".5"/></svg>';
  if(stage===1)return '<svg width="52" height="52" viewBox="0 0 52 52"><path d="M26 42V26" stroke="'+c+'" stroke-width="2"/><path d="M26 32c-6 0-9-4-9-9 6 0 9 3 9 9z" fill="'+c+'"/><path d="M26 36c6 0 9-3 9-8-6 0-9 3-9 8z" fill="'+c+'" opacity=".7"/><path d="M8 44h36" stroke="'+g+'" stroke-width="1.5"/></svg>';
  if(stage===2)return '<svg width="52" height="52" viewBox="0 0 52 52"><path d="M26 44V20M26 30c-8 0-12-5-12-12 8 0 12 5 12 12zM26 34c8 0 12-4 12-11-8 0-12 4-12 11z" fill="'+c+'"/><path d="M26 44V20" stroke="'+c+'" stroke-width="2"/><path d="M8 46h36" stroke="'+g+'" stroke-width="1.5"/></svg>';
  if(stage===3)return '<svg width="52" height="52" viewBox="0 0 52 52"><path d="M26 44V22M26 32c-8 0-12-5-12-12 8 0 12 5 12 12zM26 36c8 0 12-4 12-11-8 0-12 4-12 11z" fill="'+c+'"/><path d="M26 44V22" stroke="'+c+'" stroke-width="2"/><circle cx="26" cy="14" r="6" fill="'+g+'"/><circle cx="26" cy="14" r="2.5" fill="#FFFBF2"/><path d="M8 46h36" stroke="'+g+'" stroke-width="1.5"/></svg>';
  return '<svg width="52" height="52" viewBox="0 0 52 52"><path d="M26 44V24M26 34c-8 0-12-5-12-12 8 0 12 5 12 12zM26 38c8 0 12-4 12-11-8 0-12 4-12 11z" fill="'+c+'"/><path d="M26 44V24" stroke="'+c+'" stroke-width="2"/><circle cx="26" cy="15" r="7" fill="'+g+'"/><path d="M20 15h12M26 9v12" stroke="#FFFBF2" stroke-width="1.2"/><path d="M8 46h36" stroke="'+g+'" stroke-width="1.5"/></svg>';

/* ===================== 渲染 ===================== */
function viewToday(){
  var m=totalMerit(),field=fieldOf(m);
  var h='';
  /* 概览：总功德 + 福田整体长势（四个面各自的高低见下方平行卡，不在这里排名次） */
  h+='<section class="card overview"><div class="ov-top">'+
     '<div><div class="merit-num">'+m+'</div><div class="merit-lab">'+t('meritLab')+'</div></div>'+
     '<div class="rank"><div class="rank-name">'+t('fieldName')[field]+'</div><div class="rank-lab">'+(field>=4?t('maxDim'):t('fieldNext')(FIELD_NEED[field+1]-m))+'</div></div></div>'+
     '<div class="ov-stats">'+
       '<div class="ov-stat"><div class="ov-v">'+practiceDays()+'</div><div class="ov-k">'+t('days')+'</div></div>'+
       '<div class="ov-stat"><div class="ov-v">'+streak()+'</div><div class="ov-k">'+t('streak')+'</div></div>'+
       '<div class="ov-stat"><div class="ov-v">'+totalQ()+'</div><div class="ov-k">'+t('totalQ')+'</div></div>'+
     '</div>'+
     '<div class="field-vis"><div class="field-stage"><div class="field-emoji">'+fieldSVG(field)+'</div>'+
       '<div class="field-info"><div class="field-name">'+t('fieldTitle')+' · '+t('fieldName')[field]+'</div><div class="field-desc">'+t('fieldDesc')[field]+'</div></div></div>'+
       '<div class="field-bar"><i style="width:'+(field>=4?100:Math.round((m-FIELD_NEED[field])/(FIELD_NEED[field+1]-FIELD_NEED[field])*100))+'%"></i></div>'+
       (field<4?'<div class="field-desc" style="margin-top:6px">'+t('fieldNext')(FIELD_NEED[field+1]-m)+'</div>':'')+
     '</div>'+
     /* 四个面平行：各自累计、各自亮，谁写得多谁就深，不串成向上阶梯 */
     '<div class="dim-sec"><div class="dim-t">'+t('dimLab')+'</div>'+dimGridHTML(false)+'</div>'+
     '</section>';

  /* 四问 */
  var a=dayAnswers(todayKey());
  h+='<section class="card"><div class="card-t">'+t('qTitle')+'</div><div class="card-sub">'+t('qSub')+'</div>';
  for(var i=0;i<4;i++){
    var done=a[i]&&a[i].trim();
    h+='<div class="q'+(done?' done':'')+'" data-q="'+i+'">'+
       '<div class="q-head"><div class="q-badge">'+bodhiSVG(i,38)+'</div><div class="q-name">'+t('qName')[i]+'</div></div>'+
       '<div class="q-q">'+t('qText')[i]+'</div><div class="q-hint">'+t('qHint')[i]+'</div>'+
       '<textarea class="q-input" rows="1" data-i="'+i+'" placeholder="'+t('ph')[i]+'">'+esc(a[i])+'</textarea>'+
       '<div class="q-merit">'+t('seed')+'</div></div>';
  }
  h+='<button class="btn" data-act="plant" style="margin-top:6px">'+t('save')+'</button></section>';

  /* 法语 */
  var dh=dharmaToday();
  h+='<section class="card dharma"><div class="card-t">'+t('dharmaTitle')+'</div>'+
     '<div class="dharma-q">'+esc(dh.q)+'</div><div class="dharma-from">'+esc(dh.from)+'</div></section>';

  /* 回向 */
  var k=todayKey(),ded=DB.dedications[k]||'';
  h+='<section class="card"><div class="card-t">'+t('dedTitle')+'</div><div class="card-sub">'+t('dedSub')+'</div>';
  if(S.editDed||!ded){
    h+='<textarea class="q-input" id="dedInput" rows="2" placeholder="'+t('dedPh')+'">'+esc(ded)+'</textarea>'+
       '<button class="btn sm ghost" data-act="dedsave" style="margin-top:10px">'+t('dedSave')+'</button>';
  }else{
    h+='<div class="ded-text">'+esc(ded)+'</div><button class="ded-edit" data-act="dededit">'+t('dedEdit')+' ›</button>';
  }
  h+='</section>';

  /* 海报 + 边界说明 */
  h+='<div class="btn-row"><button class="btn ghost" data-act="poster">'+t('poster')+'</button></div>'+
     '<div class="foot">'+t('noJudge')+'<br><a href="index.html">'+t('backHome')+'</a></div>';
  return h;
}

/* 我的福田 = 总功德 + 福田整体长势 + 四个面各自进度 + 日历回看（原「回看」整块并进来，不再单开 tab） */
function viewField(){
  var m=totalMerit(),field=fieldOf(m);
  var h='<section class="card overview"><div class="ov-top">'+
     '<div><div class="merit-num">'+m+'</div><div class="merit-lab">'+t('meritLab')+'</div></div>'+
     '<div class="rank"><div class="rank-name">'+t('fieldName')[field]+'</div><div class="rank-lab">'+(field>=4?t('maxDim'):t('fieldNext')(FIELD_NEED[field+1]-m))+'</div></div></div>'+
     '<div class="field-vis"><div class="field-stage"><div class="field-emoji">'+fieldSVG(field)+'</div>'+
       '<div class="field-info"><div class="field-name">'+t('fieldTitle')+' · '+t('fieldName')[field]+'</div><div class="field-desc">'+t('fieldDesc')[field]+'</div></div></div>'+
       '<div class="field-bar"><i style="width:'+(field>=4?100:Math.round((m-FIELD_NEED[field])/(FIELD_NEED[field+1]-FIELD_NEED[field])*100))+'%"></i></div>'+
     '</div></section>';
  /* 四个面各自走到哪：平行，不排名次 */
  h+='<section class="card"><div class="card-t">'+t('dimLab')+'</div>'+dimGridHTML(true)+'</section>';
  /* 日历回看 */
  h+=calHTML();
  h+='<div class="foot">'+t('noJudge')+'<br><a href="index.html">'+t('backHome')+'</a></div>';
  return h;
}

/* 日历：有记录的日期可点，点开看当天四问，再点同日收起 */
function calHTML(){
  if(!S.month)S.month=todayKey().slice(0,7);
  var p=S.month.split('-'),y=+p[0],mo=+p[1];
  var first=new Date(y,mo-1,1),days=new Date(y,mo,0).getDate();
  var h='<section class="card"><div class="card-t">'+t('backTitle')+'</div><div class="card-sub">'+t('backSub')+'</div>'+
    '<div class="month-nav"><button data-act="mprev">‹</button><b>'+y+' · '+pad(mo)+'</b><button data-act="mnext">›</button></div>'+
    '<div class="cal-head"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="cal">';
  var lead=(first.getDay()+6)%7;
  for(var i=0;i<lead;i++)h+='<div class="cal-d" style="visibility:hidden"></div>';
  for(var d=1;d<=days;d++){
    var k=y+'-'+pad(mo)+'-'+pad(d),has=answerCount(k)>0,open=S.day===k;
    h+='<div class="cal-d'+(has?' has':'')+(open?' open':'')+'" '+(has?'data-act="day" data-k="'+k+'"':'')+'>'+d+'</div>';
  }
  h+='</div>';
  if(S.day){
    var a=dayAnswers(S.day);
    h+='<div class="day-detail"><div class="day-detail-h">'+fmtDate(S.day)+' · +'+dayMerit(S.day)+'</div>';
    for(var j=0;j<4;j++)if(a[j]&&a[j].trim())h+='<div class="day-q"><b>'+t('qName')[j]+'</b><span>'+esc(a[j])+'</span></div>';
    if(DB.dedications[S.day])h+='<div class="ded-text" style="margin-top:10px;border-top:1px dashed var(--line);padding-top:10px">'+esc(DB.dedications[S.day])+'</div>';
    h+='</div>';
  }
  h+='</section>';
  return h;
}

function render(){
  var tabs='<div class="tabs">'+
    '<button class="tab'+(S.view==='today'?' on':'')+'" data-act="tab" data-v="today">'+t('t_today')+'</button>'+
    '<button class="tab'+(S.view==='field'?' on':'')+'" data-act="tab" data-v="field">'+t('t_field')+'</button></div>';
  var back='<a class="lang back-home" href="index.html" title="'+t('backHome')+'" aria-label="'+t('backHome')+'">‹ '+t('backHome')+'</a>';
  var hdr='<header class="hdr"><div><div class="brand"><span class="seal">'+t('seal')+'</span>'+t('brand')+'</div><div class="brand-sub">'+t('sub')+'</div></div>'+
    '<div class="hdr-r">'+back+'<button class="lang" data-act="lang">'+(LANG==='zh'?'EN':'中文')+'</button></div></header>';
  var body=S.view==='today'?viewToday():viewField();
  document.getElementById('app').innerHTML=hdr+tabs+body;
}

/* ===================== 交互 ===================== */
var toastTimer=null;
function toast(msg){var e=document.getElementById('toast');e.textContent=msg;e.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(function(){e.classList.remove('on');},1900);}
function readAnswers(){var out=[];var els=document.querySelectorAll('.q-input[data-i]');for(var i=0;i<4;i++)out[i]='';for(var j=0;j<els.length;j++)out[+els[j].getAttribute('data-i')]=els[j].value;return out;}
function plant(){
  var k=todayKey(),before=dayMerit(k),ans=readAnswers();
  if(!ans.some(function(x){return x&&x.trim();})){toast(t('qSub'));return;}
  DB.days[k]={answers:ans};save();
  var after=dayMerit(k),gain=after-before;
  toast(t('dharmaDone')+gain);
  render();
}
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act');
  if(a==='lang'){LANG=LANG==='zh'?'en':'zh';try{localStorage.setItem('ft.lang',LANG);}catch(e){}render();return;}
  if(a==='tab'){S.view=el.getAttribute('data-v');S.day='';window.scrollTo(0,0);render();return;}
  if(a==='plant'){plant();return;}
  if(a==='dededit'){S.editDed=true;render();return;}
  if(a==='dedsave'){var inp=document.getElementById('dedInput');var v=inp?inp.value.trim():'';if(v){DB.dedications[todayKey()]=v;save();S.editDed=false;toast(t('dedSaved'));render();}return;}
  if(a==='poster'){showPoster();return;}
  if(a==='mprev'||a==='mnext'){var p=S.month.split('-'),d=new Date(+p[0],+p[1]-1+(a==='mnext'?1:-1),1);S.month=d.getFullYear()+'-'+pad(d.getMonth()+1);S.day='';render();return;}
  if(a==='day'){var dk=el.getAttribute('data-k');S.day=(S.day===dk)?'':dk;render();return;}
  if(a==='posterclose'){document.getElementById('posterMask').classList.remove('on');return;}
});
document.addEventListener('input',function(e){
  if(e.target.classList&&e.target.classList.contains('q-input')&&e.target.getAttribute('data-i')!==null){
    var box=e.target.closest('.q');if(box)box.classList.toggle('done',!!e.target.value.trim());
    e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px';
  }
});

/* 功德海报：canvas 生成一张安静的图，用户自己决定发不发，不显示任何互动数据 */
function showPoster(){
  var k=todayKey(),dm=dayMerit(k),m=totalMerit(),field=fieldOf(m),dh=dharmaToday(),a=dayAnswers(k);
  var c=document.createElement('canvas');c.width=600;c.height=860;var x=c.getContext('2d');
  x.fillStyle='#F7EFE0';x.fillRect(0,0,600,860);
  x.strokeStyle='#D8C7A4';x.lineWidth=2;x.strokeRect(24,24,552,812);
  x.textAlign='center';
  x.fillStyle='#B8860B';x.font='bold 30px "Songti SC",serif';
  x.fillText(LANG==='zh'?'每日福田':'DAILY MERIT FIELD',300,92);
  x.fillStyle='#93816A';x.font='15px "PingFang SC",sans-serif';x.fillText(fmtDate(k),300,122);
  /* 今日功德：就是今天答了几问，不灌水 */
  x.fillStyle='#8A6508';x.font='bold 96px "Songti SC",serif';x.fillText(''+dm,300,244);
  x.fillStyle='#6B5B45';x.font='15px "PingFang SC",sans-serif';x.fillText(t('posterToday'),300,278);
  /* 四个面：今天写了哪个就点亮哪个，谁也没压过谁 */
  for(var i=0;i<4;i++){
    var cx=100+i*133,wrote=a[i]&&a[i].trim();
    x.fillStyle=wrote?'#B93A26':'#DED2BC';
    x.beginPath();x.arc(cx,322,7,0,Math.PI*2);x.fill();
    x.fillStyle=wrote?'#8A6508':'#B3A68F';x.font='14px "PingFang SC",sans-serif';
    x.fillText(t('qName')[i].split(' ')[0],cx,350);
  }
  x.strokeStyle='#E6D9BE';x.beginPath();x.moveTo(70,384);x.lineTo(530,384);x.stroke();
  /* 今天你写下的：真实摘录，这才是海报的主体 */
  x.fillStyle='#93816A';x.font='13px "PingFang SC",sans-serif';x.textAlign='left';
  x.fillText(t('posterWrote'),70,418);
  var y=452,wroteAny=false;
  for(var j=0;j<4;j++){
    if(!(a[j]&&a[j].trim()))continue;
    wroteAny=true;
    x.fillStyle='#B93A26';x.font='13px "PingFang SC",sans-serif';
    x.fillText(t('qName')[j].split(' ')[0],70,y);
    var txt=a[j].trim();
    x.fillStyle='#4A3F30';x.font='15px "Songti SC",serif';
    var l1=txt.slice(0,18),l2=txt.length>18?txt.slice(18,36)+(txt.length>36?'…':''):'';
    x.fillText(l1,112,y);y+=26;
    if(l2){x.fillText(l2,112,y);y+=26;}
    y+=8;
  }
  if(!wroteAny){x.fillStyle='#93816A';x.font='15px "Songti SC",serif';x.fillText(t('posterEmpty'),70,458);}
  /* 底部：法语 */
  x.textAlign='center';
  x.strokeStyle='#E6D9BE';x.beginPath();x.moveTo(70,700);x.lineTo(530,700);x.stroke();
  x.fillStyle='#6B5B45';x.font='16px "Songti SC",serif';
  var q=dh.q;if(q.length>22){x.fillText(q.slice(0,22),300,744);x.fillText(q.slice(22),300,772);}else x.fillText(q,300,752);
  x.fillStyle='#93816A';x.font='12px "PingFang SC",sans-serif';x.fillText(dh.from,300,802);
  var img=c.toDataURL('image/png');
  var mask=document.getElementById('posterMask');
  mask.innerHTML='<div class="modal"><button class="modal-x" data-act="posterclose">×</button><div class="card-t" style="justify-content:center">'+t('posterTitle')+'</div><img src="'+img+'" alt="poster"><div class="card-sub" style="margin:0">'+t('posterSave')+'</div></div>';
  mask.classList.add('on');
}

};
