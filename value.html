<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F4F5F2">
<title>晨间清单 · 晚间收尾</title>
<style>
:root{
  --bg:#F4F5F2; --card:#FFFFFF; --ink:#101310; --sub:#5A615A; --line:#E4E7E1;
  --brand:#3FE081; --on:#0B120D; --brand-txt:#0E6B50;
}
.night{ --bg:#101310; --card:#16191A; --ink:#EAF1EA; --sub:#9AA79C; --line:#242A26; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.5;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap{max-width:680px;margin:0 auto;padding:0 22px}
/* lang toggle */
.lang{position:fixed;top:calc(env(safe-area-inset-top) + 14px);right:16px;z-index:9;
  font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--brand-txt);
  background:var(--card);border:1px solid var(--line);padding:8px 16px;border-radius:999px;
  box-shadow:0 4px 16px rgba(16,19,16,.08);cursor:pointer}
/* hero */
.hero{padding:84px 0 64px;text-align:center}
.sun{width:60px;height:60px;margin:0 auto 28px;display:block}
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--brand-txt);
  background:transparent;border:1px solid var(--brand-txt);padding:5px 13px;border-radius:999px}
.hero h1{font-size:clamp(30px,8.5vw,46px);line-height:1.18;font-weight:700;letter-spacing:-.02em;margin:26px 0 0}
.hero .sub{font-size:17px;color:var(--sub);margin:20px auto 0;font-weight:500}
.cta{margin-top:34px}
.btn{font-size:16px;font-weight:700;padding:15px 34px;border-radius:16px;border:0;
  background:var(--brand);color:var(--on);text-decoration:none;display:inline-block;
  box-shadow:0 8px 24px rgba(63,224,129,.35)}
/* band */
.band{padding:62px 0;text-align:center}
.band.green{background:var(--brand);color:var(--on)}
.band.dark{background:#0E6B50;color:#EAF1EA}
.band .big{font-size:clamp(26px,7vw,38px);line-height:1.22;font-weight:700;letter-spacing:-.02em;max-width:560px;margin:0 auto}
.band .small{font-size:16px;margin:16px auto 0;font-weight:500;opacity:.82;max-width:480px}
/* three rules */
.rules{padding:64px 0}
.rule{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 24px;margin:0 0 14px;
  box-shadow:0 1px 2px rgba(16,19,16,.04),0 10px 30px rgba(16,19,16,.05)}
.rule .t{font-size:20px;font-weight:700;letter-spacing:-.01em}
.rule .d{font-size:15px;color:var(--sub);margin-top:8px}
/* footer */
.foot{text-align:center;padding:56px 0 64px;border-top:1px solid var(--line);margin-top:8px}
.qr{width:120px;height:120px;margin:0 auto 18px;display:block;border-radius:16px;border:1px solid var(--line);background:#fff}
.lnk{font-size:14px;color:var(--brand-txt);font-weight:600;text-decoration:none;word-break:break-all}
.note{font-size:13px;color:var(--sub);margin-top:12px;max-width:380px;margin-left:auto;margin-right:auto}
</style>
</head>
<body>
<button class="lang" id="langBtn">EN</button>
<div class="wrap">

  <header class="hero">
    <svg class="sun" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="13" fill="#3FE081"/>
      <line x1="32" y1="4" x2="32" y2="14" stroke="#3FE081" stroke-width="3" stroke-linecap="round"/>
      <line x1="32" y1="50" x2="32" y2="60" stroke="#3FE081" stroke-width="3" stroke-linecap="round"/>
      <line x1="4" y1="32" x2="14" y2="32" stroke="#3FE081" stroke-width="3" stroke-linecap="round"/>
      <line x1="50" y1="32" x2="60" y2="32" stroke="#3FE081" stroke-width="3" stroke-linecap="round"/>
      <line x1="12" y1="12" x2="19" y2="19" stroke="#3FE081" stroke-width="3" stroke-linecap="round"/>
      <line x1="45" y1="45" x2="52" y2="52" stroke="#3FE081" stroke-width="3" stroke-linecap="round"/>
      <line x1="52" y1="12" x2="45" y2="19" stroke="#3FE081" stroke-width="3" stroke-linecap="round"/>
      <line x1="19" y1="45" x2="12" y2="52" stroke="#3FE081" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <span class="tag" id="v_tag">晨间清单 · 晚间收尾</span>
    <h1 id="v_h1">你不书写，<br>世界就会覆盖你的痕记。</h1>
    <p class="sub" id="v_sub">留痕，不是清单。</p>
    <div class="cta"><a class="btn" href="index.html" id="v_cta">开始留下痕迹</a></div>
  </header>

  <section class="band green">
    <div class="big" id="v_b1">记忆，由你的记录创造。</div>
    <div class="small" id="v_b1s">价值在回看，不在当天。</div>
  </section>

  <section class="rules">
    <div class="rule">
      <div class="t" id="v_r1t">一件就够，空白也算数</div>
      <div class="d" id="v_r1d">空白不是缺口，是那天你决定不写——它是最贵的数据。</div>
    </div>
    <div class="rule">
      <div class="t" id="v_r2t">写下困扰，就是给混乱赋予语言</div>
      <div class="d" id="v_r2d">把情绪写下来，结构就出现了。它不替你总结，让你自己看清。</div>
    </div>
    <div class="rule">
      <div class="t" id="v_r3t">它站在你这边，不是数落你</div>
      <div class="d" id="v_r3d">同盟者，不是审判者。没写也不制造负罪。</div>
    </div>
  </section>

  <section class="band dark">
    <div class="big" id="v_b2">长期，你安静地变了。</div>
    <div class="small" id="v_b2s">它不替你下结论，那个发现，留给你。</div>
  </section>

  <footer class="foot">
    <img class="qr" src="qr-morning-three.png" alt="二维码">
    <div><a class="lnk" href="https://morning-three.app.workbuddy.host/">morning-three.app.workbuddy.host</a></div>
    <div class="note" id="v_note">手机浏览器打开即用，数据只存在你这台设备。<br>今天，就留下第一笔。</div>
  </footer>

</div>
<script>
(function(){
  var h=new Date().getHours();
  var night=(h>=18||h<5);
  document.documentElement.classList.toggle('night',night);
  var m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute('content',night?'#101310':'#F4F5F2');

  /* ---- 中英切换 ---- */
  var ZH = {
    langBtn:'EN', tag:'晨间清单 · 晚间收尾',
    h1:'你不书写，<br>世界就会覆盖你的痕记。', sub:'留痕，不是清单。', cta:'开始留下痕迹',
    b1:'记忆，由你的记录创造。', b1s:'价值在回看，不在当天。',
    r1t:'一件就够，空白也算数', r1d:'空白不是缺口，是那天你决定不写——它是最贵的数据。',
    r2t:'写下困扰，就是给混乱赋予语言', r2d:'把情绪写下来，结构就出现了。它不替你总结，让你自己看清。',
    r3t:'它站在你这边，不是数落你', r3d:'同盟者，不是审判者。没写也不制造负罪。',
    b2:'长期，你安静地变了。', b2s:'它不替你下结论，那个发现，留给你。',
    note:'手机浏览器打开即用，数据只存在你这台设备。<br>今天，就留下第一笔。'
  };
  var EN = {
    langBtn:'中', tag:'Morning Three · Evening Close',
    h1:'If you don’t write,<br>the world writes over you.', sub:'Leave a trace — not a to-do list.',
    cta:'Start leaving traces',
    b1:'Memory is made by what you record.', b1s:'Its value appears when you look back, not in the moment.',
    r1t:'One line is enough. A blank day counts too.',
    r1d:'A blank isn’t a gap — it’s the day you chose not to write. Often the most honest data you have.',
    r2t:'Writing down what troubles you gives the chaos a shape.',
    r2d:'Put the feeling into words and a structure appears. It won’t summarize for you — it lets you see clearly, yourself.',
    r3t:'It’s on your side, not against you.',
    r3d:'An ally, not a judge. Miss a day, and it never makes you feel guilty.',
    b2:'Over time, you change — quietly.', b2s:'It won’t draw the conclusion for you. That discovery is yours.',
    note:'Open it in your phone’s browser and begin. Your data stays on this device only.<br>Leave your first trace today.'
  };
  var KEYS = Object.keys(ZH);

  function apply(lang){
    var D = lang==='en' ? EN : ZH;
    KEYS.forEach(function(k){
      var el = document.getElementById('v_'+k);
      if(el) el.innerHTML = D[k];
    });
    document.getElementById('langBtn').textContent = D.langBtn;
    document.documentElement.lang = lang==='en' ? 'en' : 'zh-CN';
    try{ localStorage.setItem('value.lang', lang); }catch(e){}
  }

  var pref;
  try{ pref = localStorage.getItem('value.lang'); }catch(e){}
  if(!pref){
    pref = (navigator.language||'zh').toLowerCase().indexOf('zh')===0 ? 'zh' : 'en';
  }
  apply(pref);

  document.getElementById('langBtn').addEventListener('click', function(){
    pref = (document.documentElement.lang==='zh-CN') ? 'en' : 'zh';
    apply(pref);
  });
})();
</script>
</body>
</html>
